name: Local AI prototype
on:
  push:
    paths:
      - 'prototype/local-ai/**'
      - '.github/workflows/local-ai-prototype.yml'
  pull_request:
    paths:
      - 'prototype/local-ai/**'
      - '.github/workflows/local-ai-prototype.yml'

jobs:
  compile-and-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/local-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Run mock scenarios
        run: dotnet run --configuration Release -- --mock --report mock-report.json
      - name: Verify report
        run: |
          test -f mock-report.json
          grep -q 'innkeeper' mock-report.json
          grep -q 'social-failure' mock-report.json
